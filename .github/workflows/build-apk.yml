name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Si existe el secreto con la clave privada, se usa para firmar.
      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SAILER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sailer.jks"
            echo "SAILER_KEYSTORE_FILE=$RUNNER_TEMP/sailer.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave privada"
          else
            echo "Sin clave privada: se firma con la clave de depuración"
          fi

      # Pruebas automáticas (duplicadas, borrosas, metadatos).
      - name: Pruebas
        run: ./gradlew testFullDebugUnitTest --no-daemon

      # APK completo (para instalar a mano) y paquete AAB para subir a Google Play.
      - name: Compilar APK y AAB
        env:
          SAILER_KEYSTORE_PASSWORD: ${{ secrets.SAILER_KEYSTORE_PASSWORD }}
          SAILER_KEY_ALIAS: ${{ secrets.SAILER_KEY_ALIAS }}
        run: ./gradlew assembleFullRelease bundlePlayRelease --no-daemon

      - name: Poner nombre a los archivos
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/full/release/app-full-release.apk "Nauvel-$VERSION.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "Nauvel-Play-$VERSION.aab"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Nauvel-apk
          path: Nauvel-*.apk
          retention-days: 30

      # Este es el archivo que se sube a Google Play Console.
      - name: Subir AAB de Google Play
        uses: actions/upload-artifact@v4
        with:
          name: Nauvel-play-aab
          path: Nauvel-Play-*.aab
          retention-days: 30

      # En la rama principal, publicar también una "Release" para descargarla fácil.
      - name: Publicar release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Nauvel ${{ env.VERSION }} (compilación ${{ github.run_number }})
          files: Nauvel-*.apk
          make_latest: true
