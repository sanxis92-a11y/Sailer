<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva pestaña</title>
<style>
  html, body { margin: 0; height: 100%; background: #121417; color: #e8eaed;
    font-family: system-ui, -apple-system, Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 34px; margin: 0 0 8px; letter-spacing: 1px; }
  h1 span { color: #7c5cff; }
  p { color: #9aa0a6; margin: 4px 0; font-size: 15px; line-height: 1.5; }
  ul { list-style: none; padding: 0; margin: 28px 0 0; max-width: 340px; text-align: left; }
  li { background: #1e2126; border-radius: 12px; padding: 12px 14px; margin: 8px 0;
    font-size: 14px; color: #c9ccd1; }
</style>
</head>
<body>
<main>
  <h1>⛵ <span>Sailer</span></h1>
  <p>Navegación privada</p>
  <ul>
    <li>🕶️ Todo se borra al salir</li>
    <li>🛡️ Anuncios y rastreadores bloqueados</li>
    <li>⬇️ Pulsa la flecha de arriba para descargar vídeos</li>
    <li>🔒 Tus descargas se guardan cifradas</li>
  </ul>
</main>
</body>
</html>
